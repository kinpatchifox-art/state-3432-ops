<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Ironhold 3432</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b10;--ice:#b7c9d4;--ln:rgba(155,184,199,.16);--tx:#e8eef4;--mu:#8aa0b0;--g:#e8c547;--r:#ef5b4a;--b:#3aa0d8}
*{box-sizing:border-box}html,body{margin:0;min-height:100dvh;background:var(--bg);color:var(--tx);font-family:Outfit,system-ui,sans-serif}
.serif{font-family:Fraunces,Georgia,serif}
#gate{min-height:100dvh;display:grid;place-items:center;background:radial-gradient(900px 500px at 50% 20%,#13202c 0%,var(--bg) 55%)}
.crest{width:54px;height:54px;margin:0 auto 16px;border:1px solid var(--ice);border-radius:50%;display:grid;place-items:center;color:var(--ice)}
#gate h1{font-family:Fraunces,serif;font-size:52px;text-align:center;margin:8px}
.box{width:min(400px,92vw);background:#10161e;border:1px solid var(--ln);border-radius:18px;padding:18px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 6px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--ln);background:#0c1218;color:var(--tx);font:inherit}
.enter{border:0;border-radius:10px;padding:11px;background:var(--ice);color:#0b1218;font-weight:600;cursor:pointer;width:100%;margin-top:12px}
.err{color:#ff8b8b;font-size:12px}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(7,11,16,.92);border-bottom:1px solid var(--ln)}
nav{display:flex;flex-wrap:wrap;gap:4px;background:#10161e;padding:4px;border-radius:12px;border:1px solid var(--ln)}
nav button{border:0;background:0;color:var(--mu);padding:8px 11px;border-radius:9px;cursor:pointer;font:inherit;font-weight:600}
nav button.active{background:var(--ice);color:#0b1218}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#666;margin-right:6px}
.dot.on{background:#3dd68c}
.wrap{padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:#10161e;border:1px solid var(--ln);border-radius:16px;padding:12px}
.hint{color:var(--mu);font-size:12px}
.slot{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;margin:6px 0;padding:6px;border-radius:10px;background:#0c1218;border:1px solid var(--ln)}
.slot.lead{border-color:rgba(183,201,212,.4)}
.ops{display:grid;grid-template-columns:260px 1fr;gap:12px}
.plist{max-height:70vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.rowp{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:8px;border-radius:12px;background:#10161e;border:1px solid var(--ln)}
.tag{height:40px;border-radius:9px;display:grid;place-items:center;font-size:10px;font-weight:800}
.tag.MRG{background:var(--g);color:#1a1403}.tag.AXE{background:var(--r);color:#fff}.tag.TOT{background:var(--b);color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.pill{font-size:10px;padding:2px 6px;border-radius:999px;background:#1b2430}
.clock{font:700 24px Fraunces,serif}
@media(max-width:900px){.ops{grid-template-columns:1fr}}
</style></head><body>
<div id="gate"><div><div class="crest">32</div><div class="hint" style="text-align:center;letter-spacing:.28em">STATE 3432</div><h1>Ironhold</h1><div class="hint" style="text-align:center;margin-bottom:20px">Live war room</div>
<div class="box"><label>Chief name</label><input id="chief"/><label>Access code</label><input id="code" type="password"/><div class="err" id="gerr"></div><button class="enter" id="enterBtn">Enter the war room</button></div></div></div>
<div id="app" style="display:none"><header>
<div><b class="serif">Ironhold</b> <span class="hint" id="who"></span><div class="hint"><span class="dot" id="live"></span><span id="livetxt">connecting</span></div></div>
<nav><button data-tab="castle" class="active">Castle</button><button data-tab="turrets">Turrets</button><button data-tab="rallies">Rallies</button><button data-tab="fdt">FDT</button><button data-tab="foundry">Foundry</button><button data-tab="intel">Intel</button></nav>
<div class="clock" id="clk">--:--:--</div></header>
<div class="wrap" id="view"></div></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="roster.js?v=17"></script>
<script>
const CODE='3432', KEY='s3432.war.v1', ROOM='ironhold3432';
const $=s=>document.querySelector(s);
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
const data=Object.assign({rev:0,tab:'castle',enemy:'',intel:'',clockEnd:0,rooms:{castle:{title:'Castle',slots:Array.from({length:10},()=>({name:''}))},t1:{title:'Turret NW',slots:Array.from({length:6},()=>({name:''}))},t2:{title:'Turret NE',slots:Array.from({length:6},()=>({name:''}))},t3:{title:'Turret SW',slots:Array.from({length:6},()=>({name:''}))},t4:{title:'Turret SE',slots:Array.from({length:6},()=>({name:''}))}},rallies:[],fdt:{brief:'FDT',rallies:[]},foundry:{note:'Foundry',rallies:[]}},load());
if(!data.rallies.length){['Sunfire R1','Sunfire R2','Sunfire R3'].forEach((t,i)=>data.rallies.push({target:t,inf:i===1?50:40,lan:i===1?0:20,mm:i===1?50:40,slots:Array.from({length:8},()=>({name:''}))}));}
if(!data.fdt.rallies.length){[1,2,3].forEach(i=>data.fdt.rallies.push({target:'FDT R'+i,slots:Array.from({length:8},()=>({name:''}))}));}
if(!data.foundry.rallies.length){[1,2].forEach(i=>data.foundry.rallies.push({target:'Foundry '+i,slots:Array.from({length:6},()=>({name:''}))}));}
const peers=[];
function snap(){return JSON.parse(JSON.stringify({rev:data.rev,enemy:data.enemy,intel:data.intel,clockEnd:data.clockEnd,rooms:data.rooms,rallies:data.rallies,fdt:data.fdt,foundry:data.foundry}))}
function applyRemote(s){if(!s||!(s.rev>data.rev))return;['enemy','intel','clockEnd','rooms','rallies','fdt','foundry','rev'].forEach(k=>{if(s[k]!=null)data[k]=s[k]});localStorage.setItem(KEY,JSON.stringify(data));render();}
function save(){data.rev=Date.now();localStorage.setItem(KEY,JSON.stringify(data));const s=snap();peers.forEach(c=>{try{c.send(s)}catch(e){}})}
function names(){return (window.ROSTER||[]).map(p=>p.name)}
function used(){const s=new Set();Object.values(data.rooms).forEach(r=>r.slots.forEach(x=>x.name&&s.add(x.name)));data.rallies.forEach(r=>r.slots.forEach(x=>x.name&&s.add(x.name)));data.fdt.rallies.forEach(r=>r.slots.forEach(x=>x.name&&s.add(x.name)));data.foundry.rallies.forEach(r=>r.slots.forEach(x=>x.name&&s.add(x.name)));return s}
function sel(cur){const u=used();return ['<option value="">-</option>'].concat(names().filter(n=>n===cur||!u.has(n)).map(n=>'<option '+(n===cur?'selected':'')+'>'+n+'</option>')).join('')}
function roomCard(id){const r=data.rooms[id];return '<article class="card"><b class="serif">'+r.title+'</b><div class="hint">'+r.slots.filter(s=>s.name).length+' / '+r.slots.length+'</div>'+r.slots.map((s,i)=>'<div class="slot '+(i===0?'lead':'')+'"><div>'+(i===0?'CAPTAIN':'SLOT '+(i+1))+'</div><select data-room="'+id+'" data-i="'+i+'">'+sel(s.name)+'</select></div>').join('')+'</article>'}
function rallyCards(list,kind){return list.map((r,ri)=>'<article class="card"><b class="serif">'+r.target+'</b>'+(r.inf!=null?'<div class="hint">'+r.inf+'/'+r.lan+'/'+r.mm+'</div>':'')+r.slots.map((s,i)=>'<div class="slot '+(i===0?'lead':'')+'"><div>'+(i===0?'LEAD':'JOIN '+(i+1))+'</div><select data-'+kind+'="'+ri+'" data-i="'+i+'">'+sel(s.name)+'</select></div>').join('')+'</article>').join('')}
function render(){const v=$('#view');if(!v)return;
if(data.tab==='castle')v.innerHTML='<div class="grid">'+roomCard('castle')+'</div>';
else if(data.tab==='turrets')v.innerHTML='<div class="grid">'+['t1','t2','t3','t4'].map(roomCard).join('')+'</div>';
else if(data.tab==='rallies')v.innerHTML='<div class="ops"><aside class="card"><b class="serif">Roster</b><div class="plist">'+(window.ROSTER||[]).map(p=>'<div class="rowp"><div class="tag '+p.alliance+'">'+p.alliance+'</div><div>'+p.name+'<div class="pills"><span class="pill">I '+p.infFc+' '+p.infLvl+'</span><span class="pill">L '+p.lanFc+' '+p.lanLvl+'</span><span class="pill">M '+p.mmFc+' '+p.mmLvl+'</span></div></div></div>').join('')+'</div></aside><div class="grid">'+rallyCards(data.rallies,'rally')+'</div></div>';
else if(data.tab==='fdt')v.innerHTML='<div class="card" style="margin-bottom:12px"><b class="serif">FDT brief</b><textarea id="fbrief" rows="3">'+data.fdt.brief+'</textarea></div><div class="grid">'+rallyCards(data.fdt.rallies,'fdt')+'</div>';
else if(data.tab==='foundry')v.innerHTML='<div class="card" style="margin-bottom:12px"><b class="serif">Foundry</b><textarea id="fnote" rows="2">'+data.foundry.note+'</textarea></div><div class="grid">'+rallyCards(data.foundry.rallies,'foundry')+'</div>';
else v.innerHTML='<div class="grid"><article class="card"><b class="serif">Enemy / clock</b><label>Enemy state</label><input id="enemy" value="'+(data.enemy||'')+'"/><label>Minutes</label><input id="mins" type="number" value="30"/><button class="enter" id="startClk">Start clock</button></article><article class="card"><b class="serif">Intel</b><textarea id="intel" rows="12">'+(data.intel||'')+'</textarea></article></div>';
v.querySelectorAll('select[data-room]').forEach(el=>el.onchange=()=>{data.rooms[el.dataset.room].slots[+el.dataset.i].name=el.value;save();render();});
v.querySelectorAll('select[data-rally]').forEach(el=>el.onchange=()=>{data.rallies[+el.dataset.rally].slots[+el.dataset.i].name=el.value;save();render();});
v.querySelectorAll('select[data-fdt]').forEach(el=>el.onchange=()=>{data.fdt.rallies[+el.dataset.fdt].slots[+el.dataset.i].name=el.value;save();render();});
v.querySelectorAll('select[data-foundry]').forEach(el=>el.onchange=()=>{data.foundry.rallies[+el.dataset.foundry].slots[+el.dataset.i].name=el.value;save();render();});
const fb=$('#fbrief');if(fb)fb.oninput=()=>{data.fdt.brief=fb.value;save();};
const fn=$('#fnote');if(fn)fn.oninput=()=>{data.foundry.note=fn.value;save();};
const en=$('#enemy');if(en)en.oninput=()=>{data.enemy=en.value;save();};
const intel=$('#intel');if(intel)intel.oninput=()=>{data.intel=intel.value;save();};
const st=$('#startClk');if(st)st.onclick=()=>{data.clockEnd=Date.now()+(+$('#mins').value||30)*60000;save();};}
function tick(){const el=$('#clk');if(!el)return;if(!data.clockEnd){el.textContent='--:--:--';return;}const ms=data.clockEnd-Date.now();if(ms<=0){el.textContent='00:00:00';return;}const s=Math.floor(ms/1000);el.textContent=String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
setInterval(tick,1000);
function hook(c){c.on('open',()=>{peers.push(c);c.send(snap());setLive(true);});c.on('data',applyRemote);c.on('close',()=>{const i=peers.indexOf(c);if(i>=0)peers.splice(i,1);});}
function setLive(on){const d=$('#live'),t=$('#livetxt');if(d)d.classList.toggle('on',!!on);if(t)t.textContent=on?'LIVE '+peers.length+' linked':'offline / solo';}
function startLive(){if(typeof Peer==='undefined'){setLive(false);return;}
 const host=new Peer(ROOM);host.on('open',()=>{setLive(true);$('#livetxt').textContent='LIVE host';});host.on('connection',hook);
 host.on('error',e=>{if(e.type!=='unavailable-id'){setLive(false);return;}const p=new Peer();p.on('open',()=>{const c=p.connect(ROOM);hook(c);});p.on('error',()=>setLive(false));});}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');data.tab=b.dataset.tab;localStorage.setItem(KEY,JSON.stringify(data));render();});
function openRoom(name){$('#gate').style.display='none';$('#app').style.display='block';$('#who').textContent=name;render();tick();startLive();}
$('#enterBtn').onclick=()=>{const n=$('#chief').value.trim(),c=$('#code').value.trim();if(!n){$('#gerr').textContent='Name required';return;}if(c!==CODE){$('#gerr').textContent='Wrong code';return;}localStorage.setItem('s3432.chief',n);openRoom(n);};
const saved=localStorage.getItem('s3432.chief');if(saved)openRoom(saved);
</script></body></html>
