<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>State 3432 Rally Ops</title>
<style>
:root{--bg:#0b1016;--panel:#141c26;--panel2:#1b2633;--line:#2a3848;--text:#e8eef5;--muted:#8ea0b5;--gold:#c9a227;--red:#c0392b;--blue:#2e86ab}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#0e1620;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;gap:10px;flex-wrap:wrap}
.badge{background:var(--gold);color:#1b1404;font-weight:700;padding:4px 8px;border-radius:6px}
nav button,.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:700}
nav button.active,.btn.primary{background:var(--gold);color:#1b1404;border-color:var(--gold)}
.btn.danger{background:#3a1515;border-color:#6a2a2a;color:#ffb4b4}
main{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 60px)}
aside{border-right:1px solid var(--line);padding:14px;background:#101822}
.search{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.filters{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.chip{padding:4px 8px;border-radius:99px;border:1px solid var(--line);cursor:pointer;color:var(--muted);font-size:12px}
.chip.on.MRG{background:var(--gold);color:#1b1404}.chip.on.AXE{background:var(--red);color:#fff}.chip.on.TOT{background:var(--blue);color:#fff}
.chip.on.top{background:#394;color:#fff}
.roster{overflow:auto;max-height:70vh;display:flex;flex-direction:column;gap:6px}
.player{display:grid;grid-template-columns:46px 1fr;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
.player.selected{outline:2px solid var(--gold)}
.tag{font-size:11px;font-weight:700;text-align:center;padding:3px 0;border-radius:4px;color:#fff}
.tag.MRG{background:var(--gold);color:#1b1404}.tag.AXE{background:var(--red)}.tag.TOT{background:var(--blue)}
.board{padding:16px}
.rallies{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card-h{padding:12px;background:var(--panel2)}
.slot{display:grid;grid-template-columns:64px 1fr 90px 42px;gap:6px;align-items:center;margin:6px 10px;padding:7px;border:1px dashed var(--line);border-radius:8px;background:#0f1720}
.slot.lead{border-color:var(--gold);border-style:solid}
select,input{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px;font:inherit}
.hint{color:var(--muted);font-size:12px}
.rule{background:#1e2a20;color:#9fdfb3;padding:6px 10px;margin:0 10px 8px;border-radius:8px;font-size:12px}
.ratio{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;padding:0 10px 8px}
.ratio label{font-size:11px;color:var(--muted);display:grid;gap:3px}
@media(max-width:860px){main{grid-template-columns:1fr}}
</style></head><body>
<header><div><span class="badge">3432</span> Rally Ops smart</div>
<nav><button data-event="all" class="active">All</button><button data-event="SvS">SvS</button><button data-event="Frost Dragon Tyrant">Frost Dragon</button><button data-event="Foundry">Foundry</button></nav></header>
<main><aside>
<input class="search" id="q" placeholder="Search player"/>
<div class="filters"><span class="chip on MRG" data-alli="MRG">MRG</span><span class="chip on AXE" data-alli="AXE">AXE</span><span class="chip on TOT" data-alli="TOT">TOT</span><span class="chip" id="topOnly">Top 10</span></div>
<div class="hint">Lead = Top 10. Rally 1-2 joiners = T11 FC8. Rally 3+ = FC6/FC7/T11.</div>
<div class="roster" id="roster"></div></aside>
<section class="board">
<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px"><div><b id="eventTitle">All operations</b><div class="hint">Edit Cap / Inf / Lan / MM on each rally</div></div>
<div><button class="btn" id="exportBtn">Copy lineup</button> <button class="btn primary" id="newBtn">New rally</button></div></div>
<div class="rallies" id="rallies"></div></section></main>
<dialog id="dlg"><form method="dialog" style="padding:16px;display:grid;gap:8px;background:#121a24;color:#fff;min-width:280px">
<b>Create rally</b>
<select id="ev"><option>SvS</option><option>Frost Dragon Tyrant</option><option>Foundry</option></select>
<select id="tpl"><option value="r1">Rally 1 T11 FC8 40/20/40</option><option value="r2">Rally 2 T11 FC8 50/0/50</option><option value="r3">Rally 3 mix FC6/FC7/T11</option></select>
<input id="target" placeholder="Target"/>
<label class="hint">Capacity <input id="cap" type="number" min="2" max="20" value="8"/></label>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px"><input id="inf" type="number" value="40"/><input id="lan" type="number" value="20"/><input id="mm" type="number" value="40"/></div>
<button class="btn primary" id="saveRally" value="default">Create</button></form></dialog>
<script src="roster.js"></script>
<script>
const TOP10=['khalifa','joker','buabdullah','abulamar','fahad506','dracarys','sindbad','\u0635\u0646\u062f\u064a\u062f','nuer515','faisal'];
const KEY='s3432.rallies.v3';
const TEMPLATES={r1:{joinerRule:'t11fc8',inf:40,lan:20,mm:40,cap:8,event:'SvS',mixes:[[40,20,40],[50,0,50],[50,0,50],[50,0,50],[100,0,0],[50,0,50],[50,0,50],[0,0,100]]},
r2:{joinerRule:'t11fc8',inf:50,lan:0,mm:50,cap:8,event:'SvS',mixes:[[50,0,50],[50,0,50],[50,0,50],[50,0,50],[100,0,0],[50,0,50],[50,0,50],[0,0,100]]},
r3:{joinerRule:'mix',inf:40,lan:20,mm:40,cap:8,event:'SvS',mixes:[[40,20,40],[50,0,50],[50,0,50],[40,20,40],[50,0,50],[50,0,50],[100,0,0],[0,0,100]]}};
const state={filterEvent:'all',alli:{MRG:true,AXE:true,TOT:true},q:'',topOnly:false,selected:null,rallies:JSON.parse(localStorage.getItem(KEY)||'[]')};
const $=s=>document.querySelector(s); const save=()=>localStorage.setItem(KEY,JSON.stringify(state.rallies));
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]/g,'');
function isTop10(p){const n=norm(p.name);return TOP10.some(k=>n.includes(k.replace(/ /g,''))||n.includes(k));}
function bestFc(p){return p.infFc||p.fc||'';} function bestLv(p){return p.infLvl||p.tier||'';}
function isT11FC8(p){return bestLv(p)==='T11' && (bestFc(p)==='FC8' || !bestFc(p));}
function isMixJoiner(p){const fc=bestFc(p),lv=bestLv(p);return lv==='T11'||fc==='FC6'||fc==='FC7'||fc==='FC8'||!fc;}
function joinerRuleFor(r,i){return r.joinerRule||(i<2?'t11fc8':'mix');}
function allowedForSlot(p,r,ri,si){if(si===0)return isTop10(p);return joinerRuleFor(r,ri)==='t11fc8'?isT11FC8(p):isMixJoiner(p);}
function renderRoster(){const q=state.q.toLowerCase();const box=$('#roster');box.innerHTML='';
(window.ROSTER||[]).filter(p=>state.alli[p.alliance]&&(!state.topOnly||isTop10(p))&&(!q||p.name.toLowerCase().includes(q))).forEach(p=>{const el=document.createElement('div');const sel=state.selected&&state.selected.name===p.name;el.className='player'+(sel?' selected':'');
el.innerHTML=`<div class="tag ${p.alliance}">${p.alliance}</div><div><b>${p.name}${isTop10(p)?' \u2605':''}</b><div class="hint">${bestFc(p)||'-'} ${bestLv(p)||'-'}</div></div>`;el.onclick=()=>{state.selected=sel?null:p;renderRoster();};box.appendChild(el);});}
function applyRatio(r){r.slots.forEach((s,i)=>{if(i===0){s.inf=r.inf;s.lan=r.lan;s.mm=r.mm;}else if(r.mixes&&r.mixes[i]){s.inf=r.mixes[i][0];s.lan=r.mixes[i][1];s.mm=r.mixes[i][2];}else{s.inf=r.inf;s.lan=r.lan;s.mm=r.mm;}});}
function renderRallies(){const box=$('#rallies');box.innerHTML='';const list=state.rallies.map((r,idx)=>({r,idx})).filter(x=>state.filterEvent==='all'||x.r.event===state.filterEvent);
if(!list.length){box.innerHTML='<p class="hint">Create a rally first.</p>';return;}
list.forEach(({r,idx})=>{const rule=joinerRuleFor(r,idx);const filled=r.slots.filter(s=>s.player).length;const card=document.createElement('article');card.className='card';
card.innerHTML=`<div class="card-h"><div class="hint">${r.event} \u00b7 Rally ${idx+1}</div><b>${r.target||r.template}</b><div class="hint">Lead Top10 \u00b7 ${filled}/${r.slots.length}</div><div style="margin-top:8px"><button class="btn danger" data-del="${r.id}">Delete</button></div></div><div class="rule">${rule==='t11fc8'?'Joiners: T11 + FC8':'Joiners: FC6 / FC7 / T11 mix'}</div><div class="ratio"><label>Cap <input type="number" min="2" max="20" value="${r.slots.length}" data-cap="${r.id}"></label><label>Inf <input type="number" value="${r.inf}" data-ratio="${r.id}:inf"></label><label>Lan <input type="number" value="${r.lan}" data-ratio="${r.id}:lan"></label><label>MM <input type="number" value="${r.mm}" data-ratio="${r.id}:mm"></label></div><div class="slots"></div>`;
const slots=card.querySelector('.slots');
r.slots.forEach((s,i)=>{const pool=(window.ROSTER||[]).filter(p=>allowedForSlot(p,r,idx,i));
const opts=['<option value="">Select</option>'].concat(pool.map(p=>{const val=p.alliance+'|'+p.name;const cur=(s.alliance||'')+'|'+(s.player||'');return `<option value="${val.replace(/"/g,'&quot;')}" ${cur===val?'selected':''}>[${p.alliance}] ${p.name}</option>`;}));
const row=document.createElement('div');row.className='slot'+(i===0?' lead':'');
row.innerHTML=`<div>${i===0?'LEAD \u2605':'JOIN '+i}</div><select class="assign">${opts.join('')}</select><div class="hint">${s.inf}/${s.lan}/${s.mm}</div><button class="btn" data-clear="${r.id}:${i}">clr</button>`;
row.querySelector('.assign').onchange=ev=>{if(!ev.target.value){s.player='';s.alliance='';}else{const[a,...rest]=ev.target.value.split('|');s.alliance=a;s.player=rest.join('|');}save();renderRallies();};
slots.appendChild(row);});box.appendChild(card);});}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filterEvent=b.dataset.event;$('#eventTitle').textContent=b.dataset.event==='all'?'All operations':b.dataset.event;renderRallies();});
document.querySelectorAll('[data-alli]').forEach(c=>c.onclick=()=>{state.alli[c.dataset.alli]=!state.alli[c.dataset.alli];c.classList.toggle('on',state.alli[c.dataset.alli]);renderRoster();});
$('#topOnly').onclick=()=>{state.topOnly=!state.topOnly;$('#topOnly').classList.toggle('on',state.topOnly);renderRoster();};
$('#q').oninput=e=>{state.q=e.target.value;renderRoster();};
$('#newBtn').onclick=()=>$('#dlg').showModal();
$('#tpl').onchange=()=>{const t=TEMPLATES[$('#tpl').value];$('#inf').value=t.inf;$('#lan').value=t.lan;$('#mm').value=t.mm;$('#cap').value=t.cap;$('#ev').value=t.event;};
$('#saveRally').onclick=e=>{e.preventDefault();const k=$('#tpl').value,t=TEMPLATES[k];const cap=Math.max(2,Math.min(20,+$('#cap').value||t.cap));const inf=+$('#inf').value||t.inf,lan=+$('#lan').value||t.lan,mm=+$('#mm').value||t.mm;const slots=Array.from({length:cap},()=>({player:'',alliance:'',inf,lan,mm}));(t.mixes||[]).forEach((m,i)=>{if(slots[i]){slots[i].inf=m[0];slots[i].lan=m[1];slots[i].mm=m[2];}});slots[0].inf=inf;slots[0].lan=lan;slots[0].mm=mm;state.rallies.push({id:Date.now().toString(36),event:$('#ev').value,template:k,target:$('#target').value.trim(),joinerRule:t.joinerRule,inf,lan,mm,mixes:t.mixes,slots});save();$('#dlg').close();renderRallies();};
document.addEventListener('change',e=>{const cap=e.target.dataset.cap;if(cap){const r=state.rallies.find(x=>x.id===cap);const n=Math.max(2,Math.min(20,+e.target.value||8));while(r.slots.length<n)r.slots.push({player:'',alliance:'',inf:r.inf,lan:r.lan,mm:r.mm});while(r.slots.length>n)r.slots.pop();applyRatio(r);save();renderRallies();}const ratio=e.target.dataset.ratio;if(ratio){const[id,key]=ratio.split(':');const r=state.rallies.find(x=>x.id===id);r[key]=+e.target.value||0;applyRatio(r);save();renderRallies();}});
document.addEventListener('click',e=>{const del=e.target.closest('[data-del]');if(del&&confirm('Delete rally?')){state.rallies=state.rallies.filter(r=>r.id!==del.dataset.del);save();renderRallies();}const clr=e.target.closest('[data-clear]');if(clr){const[id,idx]=clr.dataset.clear.split(':');const r=state.rallies.find(x=>x.id===id);if(r){r.slots[+idx].player='';r.slots[+idx].alliance='';save();renderRallies();}}});
$('#exportBtn').onclick=()=>{const text=state.rallies.map((r,i)=>['[R'+(i+1)+' '+r.event+'] '+(r.target||r.template)+' '+r.inf+'/'+r.lan+'/'+r.mm+' cap '+r.slots.length].concat(r.slots.map((s,j)=>(j===0?'LEAD':'J'+j)+' '+(s.player||'-')+' '+s.inf+'/'+s.lan+'/'+s.mm)).join('\n')).join('\n\n');navigator.clipboard.writeText(text||'');};
if(!state.rallies.length){[['r1','Sunfire R1'],['r2','Sunfire R2'],['r3','Sunfire R3 mix']].forEach(([k,target])=>{const t=TEMPLATES[k];const slots=Array.from({length:t.cap},()=>({player:'',alliance:'',inf:t.inf,lan:t.lan,mm:t.mm}));(t.mixes||[]).forEach((m,i)=>{if(slots[i]){slots[i].inf=m[0];slots[i].lan=m[1];slots[i].mm=m[2];}});state.rallies.push({id:'seed'+k,event:'SvS',template:k,target,joinerRule:t.joinerRule,inf:t.inf,lan:t.lan,mm:t.mm,mixes:t.mixes,slots});});save();}
renderRoster();renderRallies();
</script></body></html>
